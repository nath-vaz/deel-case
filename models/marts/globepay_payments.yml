models:
  - name: globepay_payments
    description: 'Mart table of the payments with details on acceptance and chargeback. It contains one row per payment.'
    columns:
      - name: globepay_payment_id
        description: ID of the payment in Globepay's system (PK).
        data_type: varchar
        tests:
          - not_null
          - unique
      - name: deel_payment_id
        description: ID of the payment in Deel's system (FK).
        data_type: varchar
        tests:
          - not_null
          - unique
      - name: created_at
        description: Timestamp when the transcation occured.
        data_type: timestamp
      - name: is_accepted
        description: Whether or not the transcation was accepted.
        data_type: boolean
      - name: is_cvv_provided
        description: Whether or not the CVV was provided.
        data_type: boolean
      - name: payment_amount_in_original_currency
        description: Amount of the payment in currency used.
        data_type: double
      - name: payment_amount_in_dollars
        description: Amount of the payment in US dollar.
        data_type: decimal(18,2)
        tests:
          - not_null
      - name: payment_currency
        description: The three-character ISO of the currency used for the payment.
        data_type: varchar
      - name: payment_country
        description: The two-character ISO country code of the card used for the payment.
        data_type: varchar
      - name: currency_rates
        description: Exchange rates of the different currencies compared to US dollar.
        data_type: json
      - name: is_chargeback
        description: Whether or not the payment was chargeback.
        data_type: boolean

semantic_models:
  - name: globepay_payments
    defaults:
      agg_time_dimension: created_at
    description: |
      Mart table of the payments with details on acceptance and chargeback. It contains one row per payment.
    model: ref('globepay_payments')
    entities:
      - name: payment_id
        type: primary
        expr: globepay_payment_id
    dimensions:
      - name: created_at
        expr: created_at
        type: time
        type_params:
          time_granularity: day
      - name: is_accepted
        type: categorical
      - name: is_cvv_provided
        type: categorical
      - name: payment_country
        type: categorical
      - name: payment_currency
        type: categorical

    measures:
      - name: payments
        description: Total number of payments.
        agg: count
        expr: globepay_payment_id
      - name: accepted_payments
        description: The total number of accepted payments.
        agg: sum
        expr: case when is_accepted then 1 else 0 end
      - name: declined_payments
        description: The total number of declined payments.
        agg: sum
        expr: case when is_accepted then 0 else 1 end
      - name: total_amount_usd
        description: Total amount of payments in US dollars.
        agg: sum
        expr: payment_amount_in_dollars
      - name: accepted_amount_usd
        description: Total amount of accepted payments in US dollars.
        agg: sum
        expr: case when is_accepted then payment_amount_in_dollars else 0 end
      - name: declined_amount_usd
        description: Total amount of declined payments in US dollars.
        agg: sum
        expr: case when not is_accepted then payment_amount_in_dollars else 0 end
      - name: chargebacks
        description: Total number of payments that have been charged back.
        agg: sum
        expr: case when is_chargeback then 1 else 0 end
      - name: chargeback_amount_usd
        description: Total amount of payments that have been charged back in US dollars.
        agg: sum
        expr: case when is_chargeback then payment_amount_in_dollars else 0 end

metrics:
  - name: payments
    label: Payments
    description: Total number of payments.
    type: simple
    type_params:
      measure: payments
  - name: accepted_payments
    label: Accepted payments
    description: The total number of accepted payments.
    type: simple
    type_params:
      measure: accepted_payments
  - name: accepted_amount_usd
    label: Accepted amount (USD)
    description: Total amount of accepted payments in US dollars.
    type: simple
    type_params:
      measure: accepted_amount_usd
  - name: declined_payments
    label: Declined payments
    description: The total number of declined payments.
    type: simple
    type_params:
      measure: declined_payments
  - name: declined_amount_usd
    label: Declined amount (USD)
    description: Total amount of declined payments in US dollars.
    type: simple
    type_params:
      measure: declined_amount_usd
  - name: total_amount_usd
    label: Total amount (USD)
    description: Total amount of payments in US dollars.
    type: simple
    type_params:
      measure: total_amount_usd
  - name: chargebacks
    label: Chargebacks
    description: Total number of payments that have been charged back.
    type: simple
    type_params:
      measure: chargebacks

  - name: acceptance_rate
    label: Acceptance rate
    description: The % of payments that were accepted
    type: ratio
    type_params: {numerator: accepted_payments, denominator: payments}
  - name: acceptance_rate_by_value
    label: Acceptance rate by value
    description: The % of payment amount that were accepted
    type: ratio
    type_params: {numerator: accepted_amount_usd, denominator: total_amount_usd}
  - name: chargeback_rate
    label: Chargeback rate
    description: The % of payments that were charged back (among accepted payments)
    type: ratio
    type_params: {numerator: chargebacks, denominator: accepted_payments}